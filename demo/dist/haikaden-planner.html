<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 配置: 左に積荷の条件、中央に3Dの荷台、右に積付け指示書。狭い画面では縦に積む */
:root {

  --warn: #A36A12;
  --ng: #BF2F2F;

  --warn-bg: #F8ECD6;
  --ng-bg: #F9E1E1;
  --band-ok: #BFE0CB;
  --band-warn: #F1DDB4;
  --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) {

    --ok: #6CC594; --warn: #E3AF55; --ng: #F07A7A;
    --ok-bg: #15301F; --warn-bg: #33270F; --ng-bg: #3A1717;
    --band-ok: #1F4A31; --band-warn: #4A3A17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111517; --panel: #181E21; --ink: #E4E9E7; --muted: #98A4A8; --line: #2A3337;
  --stage: #0C1012; --accent: #F0973A; --accent-ink: #1A1206; --steel: #86A9BB;
  --ok: #6CC594; --warn: #E3AF55; --ng: #F07A7A;
  --ok-bg: #15301F; --warn-bg: #33270F; --ng-bg: #3A1717;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.6; }
.app { padding-inline: 16px; padding-block: 16px 32px; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.mono, .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 20px; letter-spacing: 0.02em; }
.mark { width: 22px; height: 16px; border: 2px solid var(--steel); border-radius: 2px; background: repeating-linear-gradient(90deg, transparent 0 3px, var(--steel) 3px 4px); flex: none; }
.chip { font-size: 11px; letter-spacing: 0.08em; padding: 1px 7px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
.sub { margin: 0; color: var(--muted); max-width: 70ch; font-size: 13px; }

.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 15px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h3 { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

.qty { width: 100%; border-collapse: collapse; }
.qty td { padding: 3px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.qty tr:last-child td { border-bottom: 0; }
.qty .nm { font-size: 13px; line-height: 1.3; padding-right: 6px; }
.qty .nm small { display: block; color: var(--muted); font-size: 11px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.step { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.step button { width: 24px; height: 24px; border: 1px solid var(--line); background: transparent; border-radius: 4px; line-height: 1; }
.step input { width: 34px; text-align: center; border: 0; background: transparent; font-family: var(--font-num); }
.qty-head { display: flex; justify-content: space-between; align-items: baseline; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: var(--r); padding: 5px 10px; font-size: 12px; }
.ghost:hover { border-color: var(--muted); }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 11px 14px; font-weight: 700; font-size: 15px; }
.primary[disabled] { opacity: 0.6; cursor: progress; }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.plans { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.evo { color: var(--steel); font-weight: 700; }
.prog { display: block; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.prog i { display: block; height: 100%; background: var(--steel); transition: width 0.2s; }
.evobox svg { width: 100%; height: auto; display: block; }
.evobox .ax { stroke: var(--line); }
.evobox .ln { fill: none; stroke: var(--steel); stroke-width: 2; }
.evobox .pt { fill: var(--accent); }
.evobox .tx { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }
.evobox p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.plan { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plan[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.plan .k { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; display: flex; justify-content: space-between; gap: 6px; }
.plan .t { font-weight: 700; font-size: 14px; }
.plan .s { font-size: 12px; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.badge { color: var(--accent); font-weight: 700; }

.viewport { position: relative; height: min(66vh, 640px); min-height: 360px; border-radius: var(--r); overflow: hidden; background: var(--stage); border: 1px solid var(--line); }
#view { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
.tag3d { position: absolute; transform: translate(-50%, -100%); font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 1px 6px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 18px rgb(0 0 0 / 0.14); max-width: 260px; }
.tip b { font-size: 13px; }
.tip .mono { color: var(--muted); }
.tools { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.tools > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 9px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.play { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 3px 10px 3px 4px; flex: 1 1 260px; min-width: 0; }
.play button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 4px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.play input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); }
.play .mono { font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend { position: absolute; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; font-size: 11px; max-width: calc(100% - 16px); }
.under { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }
.hint3d { font-size: 11.5px; color: var(--muted); }
.caption { margin: 0; font-size: 13px; min-height: 1.6em; flex: 1 1 360px; min-width: 0; }
.caption .n { font-family: var(--font-num); color: var(--accent); font-weight: 500; margin-right: 6px; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tile { background: var(--panel); padding: 8px 9px; min-width: 0; }
.tile .l { font-size: 11px; color: var(--muted); }
.tile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 500; line-height: 1.25; white-space: nowrap; }
.tile .v small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }

.gauge { display: flex; flex-direction: column; gap: 4px; }
.track { position: relative; height: 26px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); overflow: hidden; }
.band { position: absolute; top: 0; bottom: 0; }
.center { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--muted); }
.marker { position: absolute; top: 2px; bottom: 2px; width: 4px; margin-left: -2px; background: var(--accent); border-radius: 2px; transition: left 0.3s; }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks li { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12.5px; align-items: start; }
.pill { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 3px; min-width: 34px; text-align: center; margin-top: 2px; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.ng { color: var(--ng); background: var(--ng-bg); }
.checks .note { grid-column: 2; color: var(--muted); font-size: 11.5px; font-family: var(--font-num); }

.left { font-size: 12.5px; background: var(--warn-bg); border-radius: var(--r); padding: 8px 10px; }
.left b { color: var(--warn); }

.steps { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; border-top: 1px solid var(--line); }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 0 6px; padding: 5px 4px; border-bottom: 1px solid var(--line); font-size: 12.5px; cursor: pointer; line-height: 1.4; }
.steps li:hover, .steps li.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.steps li.done .n { color: var(--muted); }
.steps .n { font-family: var(--font-num); color: var(--accent); text-align: right; }
.steps .w { color: var(--muted); grid-column: 2; font-size: 11.5px; }

.sources { font-size: 12px; color: var(--muted); }
.sources summary { cursor: pointer; }
.sources ul { margin: 6px 0 0; padding-left: 18px; columns: 2 260px; }
.sources a { color: inherit; }

@media (max-width: 1280px) {
  .plans { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { grid-template-columns: 290px minmax(0, 1fr); }
  .sheet { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .sheet > h2 { grid-column: 1 / -1; }
}
@media (max-width: 820px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .stage { order: -1; }
  .plans { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .viewport { height: 58vh; min-height: 320px; }
  .hint3d { display: none; }
}
@media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>廃家電 積付けプランナー</h1><span class="chip">デモ</span></div>
    <p class="sub">リサイクル輸送する廃家電について、品目ごとの積み重ねルール・耐荷重・重心を守った積込みパターンを自動で作ります。寸法は実製品の公称値に、メーカーや年式の違いとして±4%程度のばらつきを加えたサンプルです。</p>
  </header>

  <main class="grid">
    <section class="panel manifest" aria-label="積荷の条件">
      <h2>積荷の条件</h2>
      <div class="field">
        <label for="container">コンテナ</label>
        <select id="container"></select>
        <p class="hint" id="containerNote"></p>
      </div>
      <div class="qty-head"><h3>品目と台数</h3><span class="mono" id="totalCount"></span></div>
      <table class="qty" id="qty"></table>
      <div class="presets" aria-label="台数のプリセット">
        <button class="ghost" data-total="30" type="button">少なめ 30台</button>
        <button class="ghost" data-total="59" type="button">標準 59台</button>
        <button class="ghost" data-total="80" type="button">多め 80台</button>
      </div>
      <details>
        <summary>詳細条件</summary>
        <div class="opts">
          <div class="field"><label for="gap">列のすき間</label>
            <select id="gap"><option value="10">10 mm</option><option value="20" selected>20 mm</option><option value="40">40 mm</option></select></div>
          <div class="field"><label for="topClear">天井とのすき間</label>
            <select id="topClear"><option value="30">30 mm</option><option value="50" selected>50 mm</option><option value="100">100 mm</option></select></div>
        </div>
      </details>
      <div class="presets">
        <button class="ghost" id="reroll" type="button">別の個体で作り直す</button>
      </div>
      <button class="primary" id="generate" type="button">積付けパターンを作る</button>
      <p class="hint" id="calcInfo"></p>
    </section>

    <section class="stage" aria-label="積付けパターン">
      <div class="plans" role="tablist" id="plans"></div>
      <div class="viewport" id="viewport">
        <canvas id="view" aria-label="コンテナ内の積付けを示す3D表示"></canvas>
        <div id="tags"></div>
        <div class="legend" id="legend" hidden></div>
        <div class="tip" id="tip" hidden></div>
        <div class="tools">
          <div class="play">
            <button id="playBtn" type="button">積込み順を再生</button>
            <input type="range" id="stepRange" min="0" max="1" value="1" aria-label="積込みの手順">
            <span class="mono" id="stepNum"></span>
          </div>
          <div class="seg" role="group" aria-label="視点">
            <button type="button" data-view="iso" aria-pressed="true">斜め</button>
            <button type="button" data-view="door" aria-pressed="false">扉側</button>
            <button type="button" data-view="top" aria-pressed="false">真上</button>
            <button type="button" data-view="side" aria-pressed="false">側面</button>
          </div>
          <div class="seg" role="group" aria-label="色">
            <button type="button" data-color="real" aria-pressed="true">実物</button>
            <button type="button" data-color="cat" aria-pressed="false">品目別</button>
          </div>
        </div>
      </div>
      <div class="under">
        <p class="caption" id="caption"></p>
        <span class="hint3d">ドラッグで回転 ・ 右ドラッグかShiftで移動 ・ ホイールかピンチで拡大 ・ 品目をクリックで詳細</span>
      </div>
    </section>

    <section class="panel sheet" aria-label="積付け結果">
      <h2>積付け結果 <span class="hint" id="planName"></span></h2>
      <div class="tiles" id="tiles"></div>
      <div class="evobox" id="evoBox" hidden>
        <h3 id="evoTitle">遺伝的アルゴリズムの進化</h3>
        <svg id="evoChart" viewBox="0 0 300 86" role="img" aria-label="世代ごとの最良個体の成績"></svg>
        <p id="evoText"></p>
      </div>
      <div class="gauge">
        <h3>前後の重心</h3>
        <div class="track" id="track">
          <div class="band" id="bandWarn"></div>
          <div class="band" id="bandOk"></div>
          <div class="center"></div>
          <div class="marker" id="marker"></div>
        </div>
        <div class="ends"><span>奥</span><span id="cogText" class="mono"></span><span id="doorEnd">扉</span></div>
      </div>
      <div>
        <h3 style="margin-bottom:6px">制約チェック</h3>
        <ul class="checks" id="checks"></ul>
      </div>
      <div class="left" id="leftovers" hidden></div>
      <div>
        <h3 style="margin-bottom:6px">積込み手順</h3>
        <ol class="steps" id="steps"></ol>
      </div>
    </section>
  </main>

  <details class="sources">
    <summary>寸法・仕様の出典</summary>
    <ul id="sources"></ul>
  </details>
</div>
